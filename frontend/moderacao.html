<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Moderação | Hidrovia Online</title><style>body{font-family:system-ui;background:#071b29;color:#eef6fa;margin:0;padding:24px}main{max-width:900px;margin:auto}a{color:#7bd5ff}article{background:#123348;border:1px solid #2e576b;border-radius:12px;padding:18px;margin:12px 0}button{padding:10px 14px;margin:5px;border:0;border-radius:6px;cursor:pointer}h1{margin-bottom:4px}.muted{color:#a9c3d1}</style></head><body><main><a href="/index.html">← Voltar ao mapa</a><h1>Moderação de relatos</h1><p><a href="/sinalizacao-admin.html">Administrar sinalização náutica →</a></p><p class="muted">Apenas administradores podem aprovar ou rejeitar relatos. Registros pendentes não aparecem no mapa público.</p><p id="msg" role="status"></p><section id="items"></section></main><script>
const msg=document.getElementById('msg'),items=document.getElementById('items');
async function request(url,options={}){const response=await fetch(url,{credentials:'same-origin',...options});const data=await response.json();if(!response.ok)throw Error(data.error||'Falha na requisição');return data}
async function load(){try{const me=await request('/api/auth/me');if(me.role!=='admin')throw Error('Acesso restrito a administradores.');const list=await request('/api/relatos/moderacao');items.replaceChildren();msg.textContent=list.length?list.length+' relato(s) aguardando análise.':'Nenhum relato pendente.';for(const r of list){const card=document.createElement('article'),title=document.createElement('h2'),description=document.createElement('p'),info=document.createElement('p');title.textContent=r.titulo;description.textContent=r.descricao||'Sem descrição';info.textContent=[r.tipo,r.gravidade,r.lat+', '+r.lng].join(' · ');card.append(title,description,info);for(const [status,label] of [['ATIVO','Aprovar'],['REJEITADO','Rejeitar']]){const button=document.createElement('button');button.textContent=label;button.onclick=async()=>{button.disabled=true;try{await request('/api/relatos/'+encodeURIComponent(r._id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await load()}catch(err){msg.textContent=err.message;button.disabled=false}};card.append(button)}items.append(card)}}catch(err){msg.textContent=err.message}}
load();
</script></body></html>
