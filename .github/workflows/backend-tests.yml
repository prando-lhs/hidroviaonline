name: Testes backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes unitários e integração MongoDB
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/hidrovia_ci_test
        run: npm test
